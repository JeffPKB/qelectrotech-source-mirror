name: Windows 0.100 perso

# Builds the 0.100 stable version with the local fixes (terminal strip
# font saved in the project, 9 px by default, wire numbers under the
# terminals) and publishes a zip holding only the "bin" folder: it replaces
# the "bin" folder of an existing QElectroTech 0.100 installation.

on:
  push:
    branches: [qet-0.100-perso]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout the needed submodules
        shell: bash
        run: git submodule update --init --depth 1 SingleApplication pugixml elements

      - name: Install MSYS2 with Qt5
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-qt5-tools
            mingw-w64-ucrt-x86_64-qt5-translations
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-angleproject
            mingw-w64-ucrt-x86_64-extra-cmake-modules

      - name: Build with cmake
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/ucrt64 \
            -DQT_VERSION_MAJOR=5 \
            -DBUILD_WITH_KF5=ON \
            -DBUILD_KF5=ON \
            -DKF5_GIT_TAG=v5.116.0 \
            -DBUILD_TESTING=OFF \
            -DPACKAGE_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DSQLite3_INCLUDE_DIR=/ucrt64/include \
            -DSQLite3_LIBRARY=/ucrt64/lib/libsqlite3.dll.a \
            ..
          ninja -j"$(nproc)"

      - name: Deploy exe + Qt + DLLs into bin/
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/out/bin"
          mkdir -p "$BIN"
          EXE=$(find "$GITHUB_WORKSPACE/build" -maxdepth 3 -iname "qelectrotech.exe" | head -1)
          [ -n "$EXE" ] || { echo "ERROR: qelectrotech.exe not built"; exit 1; }
          cp "$EXE" "$BIN/qelectrotech.exe"
          # KF5 libraries built by the project itself (FetchContent)
          find "$GITHUB_WORKSPACE/build" -iname "*KF5*.dll" -exec cp {} "$BIN/" \;
          ls "$BIN"

          cd "$BIN"
          WINDEPLOY=$(command -v windeployqt-qt5 || command -v windeployqt || true)
          [ -z "$WINDEPLOY" ] && WINDEPLOY=$(find /ucrt64 -iname "windeployqt*.exe" | grep -v qt6 | head -1)
          echo "windeployqt: $WINDEPLOY"
          "$WINDEPLOY" --release --no-translations --no-compiler-runtime ./qelectrotech.exe || true

          # Copy every DLL of /ucrt64/bin the exe and the plugins depend on
          # Qt plugins: copied by hand if windeployqt stopped before them
          QT_PLUGINS=$(/ucrt64/bin/qmake-qt5 -query QT_INSTALL_PLUGINS 2>/dev/null || true)
          [ -d "$QT_PLUGINS" ] || QT_PLUGINS=$(dirname "$(find /ucrt64 -path '*qt5*' -iname qwindows.dll | head -1)")/..
          echo "Qt plugins: $QT_PLUGINS"
          for d in platforms styles imageformats iconengines sqldrivers printsupport; do
            if [ -d "$QT_PLUGINS/$d" ] && [ ! -d "$BIN/$d" ]; then
              mkdir -p "$BIN/$d"
              find "$QT_PLUGINS/$d" -maxdepth 1 -iname "*.dll" ! -iname "*d.dll" -exec cp {} "$BIN/$d/" \;
              # keep the release dll whose name really ends with d (qsqlodbc...)
              find "$QT_PLUGINS/$d" -maxdepth 1 -iname "*.dll" -exec sh -c '[ -f "$2/$(basename "$1")" ] || cp "$1" "$2/"' _ {} "$BIN/$d" \;
            fi
          done

          set +e
          for PASS in 1 2 3; do
            for f in "$BIN"/*.dll "$BIN"/*.exe "$BIN"/*/*.dll; do
              [ -f "$f" ] || continue
              while IFS= read -r line; do
                dll=$(echo "$line" | awk '{print $3}')
                [ -f "$dll" ] || continue
                [ -f "$BIN/$(basename "$dll")" ] || cp "$dll" "$BIN/"
              done < <(ldd "$f" 2>/dev/null | grep -i '/ucrt64/bin/')
            done
          done
          set -e
          cp -n /ucrt64/bin/libgcc_s_seh-1.dll /ucrt64/bin/libstdc++-6.dll /ucrt64/bin/libwinpthread-1.dll "$BIN/" || true
          echo "DLLs: $(find "$BIN" -name '*.dll' | wc -l)"
          ls "$BIN/platforms/qwindows.dll"

      - name: Assemble the full portable folder
        shell: pwsh
        run: |
          $dst = "out"
          foreach ($d in @("elements", "titleblocks", "examples", "ico", "lang")) {
            if (Test-Path $d) { Copy-Item -Recurse -Force $d "$dst\$d" }
          }
          Get-ChildItem "$dst\lang" -Filter *.ts | Remove-Item
          foreach ($f in @("ChangeLog", "CREDIT", "ELEMENTS.LICENSE", "LICENSE", "README")) {
            if (Test-Path $f) { Copy-Item $f "$dst\" }
          }
          Copy-Item "build-aux\windows\Lancer QET.bat" "$dst\"
          Copy-Item misc\theme-sombre\style.css "$dst\theme-sombre-style.css"
          @"
          QElectroTech 0.100 + modifications perso
          - taille de police du gestionnaire de bornier enregistree dans le projet (9 par defaut)
          - numeros de fil, repere d'arrivee, conducteurs et cables sous les bornes
          - symbole du type de borne (fusible, sectionnable, terre, diode)
          - theme sombre (theme-sombre-style.css)

          Installation : dezipper ce dossier ou vous voulez, par exemple C:\QElectroTech-perso,
          puis lancer "Lancer QET.bat". L'installation actuelle de QElectroTech n'est pas touchee.

          Theme sombre : copier theme-sombre-style.css sous le nom style.css dans
          C:\Users\<votre nom>\AppData\Local\QElectroTech\QElectroTech\
          puis decocher "Utiliser les couleurs du systeme" dans Configuration > General.
          "@ | Out-File -Encoding utf8 "$dst\LISEZ-MOI.txt"
          Compress-Archive -Path "$dst\*" -DestinationPath QElectroTech-0.100-perso.zip
          Get-Item QElectroTech-0.100-perso.zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QElectroTech-0.100-perso
          path: QElectroTech-0.100-perso.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.100-perso
          name: QElectroTech 0.100 perso
          prerelease: false
          files: QElectroTech-0.100-perso.zip
